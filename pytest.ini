[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Pure unit tests — no models, no API calls (fast)
    integration: Uses local ML models — slow first run, fast after cache
    api: Tests FastAPI endpoints via TestClient
    live: Makes real Groq API calls — requires GROQ_API_KEY in env

# Show local vars on failure, short traceback format
addopts = -v --tb=short
